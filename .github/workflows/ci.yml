name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # gpui renders through Metal on macOS; that is the platform Randori is built and tested on.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # jj's git operations need git >= 2.42; the runner's Xcode git can be older.
      - name: Install a current git
        run: |
          brew install git
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

      # rustup reads rust-toolchain.toml and installs the pinned toolchain.
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo clippy -p randori --features screenshot -- -D warnings

      - name: Test
        run: cargo test --workspace
