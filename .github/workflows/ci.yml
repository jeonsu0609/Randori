name: CI

# When it runs (see AGENTS.md, "Branches and CI"): on main, on a pull request
# that is ready for review, and by hand. Not on a draft, and not for a change
# to documentation alone.
on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "doc/**"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ["**/*.md", "doc/**"]
  workflow_dispatch:

# A new push to a pull request stops the run on the one before; runs on main
# all finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    if: ${{ !github.event.pull_request.draft }}
    # gpui renders through Metal on macOS; that is the platform Randori is built and tested on.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # jj's git operations need git >= 2.42; the runner's Xcode git can be older.
      - name: Install a current git
        run: |
          brew install git
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

      # rustup reads rust-toolchain.toml and installs the pinned toolchain.
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo clippy -p randori --features screenshot -- -D warnings

      - name: Test
        run: cargo test --workspace

      # the commit flow driven through the app's own key bindings; the
      # script makes and checks its repository with the jj CLI
      - name: UI flow
        # jj 0.46, the version of jj-lib Randori reads the repositories with
        # (Homebrew has a newer one): the CLI makes the test's repositories
        env:
          JJ_VERSION: 0.46.0
        run: |
          curl -sSfL "https://github.com/jj-vcs/jj/releases/download/v${JJ_VERSION}/jj-v${JJ_VERSION}-aarch64-apple-darwin.tar.gz" \
            | tar xz -C "$RUNNER_TEMP" ./jj
          export PATH="$RUNNER_TEMP:$PATH"
          jj --version
          script/ui-flow-test.sh

  windows:
    if: ${{ !github.event.pull_request.draft }}
    # Randori is tested on macOS; this keeps it building where users run it too.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build -p randori

  linux:
    if: ${{ !github.event.pull_request.draft }}
    # GPUI on Linux draws through Vulkan on X11 or Wayland; this keeps Randori
    # building there, as for Windows.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # what GPUI links against (gpui-kit's script/install-linux.sh, less its
      # webview)
      - name: Install GPUI's libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libfontconfig-dev libwayland-dev \
            libxkbcommon-x11-dev libx11-xcb-dev libssl-dev libzstd-dev \
            libasound2-dev libvulkan1

      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build -p randori
