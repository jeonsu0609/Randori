# Randori: a jj client. The root package is the jj engine taken from GG (worker,
# messages, config, askpass); the gpui application is crates/randori.
[workspace]
members = [".", "crates/randori"]
default-members = ["crates/randori"]

[package]
name = "randori-core"
version = "0.1.0"
description = "The jj engine of Randori, taken from GG - Gui for JJ"
authors = ["Thomas Castiglione", "jeonsu0609"]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/jeonsu0609/Randori"
publish = false

[lib]
# Kept from GG so the worker code and upstream merges stay unchanged.
name = "gg_lib"
path = "src/lib.rs"

[dev-dependencies]
assert_matches = "1.5"
tempfile = "3.27"
zip = "6.0"

[dependencies]
jj-lib = { version = "0.46.0", features = ["watchman"] }
jj-cli = "0.46.0"

# deps shared with JJ, which we try to keep on the same version
etcetera = "0.11.0"
dunce = "1.0.5"
itertools = "0.15"
indexmap = "2.14"
gix = { version = "0.88.0", default-features = false, features = [
    "index",
    "max-performance-safe",
    "blob-diff",
] }
async-trait = "0.1.89"
pollster = "1.0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.150"
tempfile = "3.27"
tokio = { version = "1.52.3", features = ["io-util"] }
toml_edit = { version = "0.25.12", features = ["serde"] }
thiserror = "2.0.18"

# deps used by JJ but with different features
chrono = { version = "0.4.44", features = ["serde"] }

# extra deps not used by JJ
anyhow = "1.0.100"
log = "0.4"
# "io" for the futures AsyncRead traits jj-lib now uses instead of tokio's
futures-util = { version = "0.3.31", features = ["io"] }
interprocess = "2"
uuid = { version = "1", features = ["v4"] }

[profile.dev]
debug = 0

# Smaller, faster release binaries: thin LTO across crates, one codegen unit,
# and no symbol tables in the shipped executable.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
