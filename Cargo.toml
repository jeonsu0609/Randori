[package]
name = "gg-cli"
version = "0.46.0"
description = "GG - Gui for JJ"
authors = ["Thomas Castiglione"]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/gulbanana/gg"
homepage = "https://github.com/gulbanana/gg"
keywords = ["jujutsu", "jj", "vcs", "scm", "gui"]
categories = ["development-tools"]
include = [
    "/dist/**/*",
    "/res/hallucination.png",
    "/res/icons/*",
    "/src/**/*",
    "/build.rs",
    "/Tauri.toml",
    "/index.html",
    "/LICENSE",
    "/README.md",
]

[package.metadata.release]
pre-release-hook = ["npm", "run", "build"]

[lib]
name = "gg_lib"
path = "src/lib.rs"

[[bin]]
name = "gg"
path = "src/main.rs"
required-features = ["gui"]

# custom-protocol is magic - tauri build adds it, tauri dev removes. it's on by default so that cargo run works
[features]
default = ["gui", "custom-protocol"]
app = []
custom-protocol = ["gui", "tauri/custom-protocol"]
ts-rs = ["dep:ts-rs"]
# Randori: the Tauri app (`gg` binary, web mode, `RunOptions`). Off for crates that
# only need the jj worker, such as the gpui frontend in crates/randori.
gui = [
    "dep:tauri-build",
    "dep:tauri",
    "dep:tauri-codegen",
    "dep:tauri-macros",
    "dep:tauri-plugin",
    "dep:tauri-runtime",
    "dep:tauri-runtime-wry",
    "dep:tauri-utils",
    "dep:tauri-plugin-dialog",
    "dep:tauri-plugin-http",
    "dep:tauri-plugin-shell",
    "dep:tauri-plugin-window-state",
    "dep:tauri-plugin-log",
    "dep:tauri-plugin-single-instance",
]

[build-dependencies]
tauri-build = { version = "2.0.0", features = ["config-toml"], optional = true }

[dev-dependencies]
assert_matches = "1.5"
http-body-util = "0.1.3"
tempfile = "3.27"
tower = "0.5.2"
zip = "6.0"

[dependencies]
tauri = { version = "2.0.0", features = ["config-toml"], optional = true }
tauri-codegen = { version = "2.0.0", optional = true }
tauri-macros = { version = "2.0.0", optional = true }
tauri-plugin = { version = "2.0.0", optional = true }
tauri-runtime = { version = "2.0.0", optional = true }
tauri-runtime-wry = { version = "2.0.0", optional = true }
tauri-utils = { version = "2.0.0", optional = true }
tauri-plugin-dialog = { version = "2.0.0", optional = true }
tauri-plugin-http = { version = "2.0.0", optional = true }
tauri-plugin-shell = { version = "2.0.0", optional = true }
tauri-plugin-window-state = { version = "2.0.0", optional = true }
tauri-plugin-log = { version = "2.0.0", optional = true }

jj-lib = { version = "0.46.0", features = ["watchman"] }
jj-cli = "0.46.0"

# deps shared with JJ, which we try to keep on the same version
clap = { version = "4.6.1", features = [
    "derive",
    "deprecated",
    "wrap_help",
    "string",
] }
etcetera = "0.11.0"
dunce = "1.0.5"
itertools = "0.15"
indexmap = "2.14"
gix = { version = "0.88.0", default-features = false, features = [
    "index",
    "max-performance-safe",
    "blob-diff",
] }
async-trait = "0.1.89"
pollster = "1.0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.150"
tempfile = "3.27"
tokio = { version = "1.52.3", features = ["io-util"] }
toml_edit = { version = "0.25.12", features = ["serde"] }
thiserror = "2.0.18"

# deps used by JJ but with different features
chrono = { version = "0.4.44", features = ["serde"] }

# extra deps not used by JJ
anyhow = "1.0.100"
log = "0.4"
# "io" for the futures AsyncRead traits jj-lib now uses instead of tokio's
futures-util = { version = "0.3.31", features = ["io"] }
humantime = "2"
ts-rs = { version = "7.1.1", features = ["chrono-impl"], optional = true }
axum = "0.8.8"
webbrowser = { version = "1", features = ["hardened"] }
interprocess = "2"
uuid = { version = "1", features = ["v4"] }

# deps shared with tauri to work around wayland issues
[target."cfg(target_os = \"linux\")".dependencies]
gtk = "0.18"

# not linux, see open_forwarded_launch()
[target."cfg(any(target_os = \"macos\", windows))".dependencies]
tauri-plugin-single-instance = { version = "2.4.5", optional = true }

[target."cfg(windows)".dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
] }

[target."cfg(target_os = \"macos\")".dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "NSData",
    "NSDictionary",
    "NSProcessInfo",
    "NSString",
    "NSURL",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "NSApplication",
    "NSAttributedString",
    "NSButton",
    "NSControl",
    "NSDocumentController",
    "NSFont",
    "NSImage",
    "NSResponder",
    "NSStringDrawing",
    "NSTextField",
    "NSView",
    "NSWindow",
    "objc2-core-foundation",
] }

[profile.dev]
debug = 0
