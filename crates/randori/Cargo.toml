[package]
name = "randori"
version = "0.1.0"
description = "Randori - a GPU-accelerated desktop client for Jujutsu, built on GG and gpui-kit"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/jeonsu0609/Randori"
publish = false

[[bin]]
name = "randori"
path = "src/main.rs"

[dependencies]
# jj worker, messages and config (the root package, taken from GG).
randori-core = { path = "../.." }
gpui-kit = "0.9.0"
# Same jj-lib as GG; needed to name `UserSettings`.
jj-lib = "0.46.0"
anyhow = "1.0.100"
chrono = "0.4.44"
# Issue link patterns in descriptions (the version jj already builds).
regex = "1.12"
etcetera = "0.11.0"
futures = "0.3.31"
log = "0.4"
pollster = "1.0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.150"
# Only for `--screenshot`; same major version gpui renders into.
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
# The gpui that gpui-kit pins, listed only to turn on `Window::render_to_image`.
# A caret range, not `=`: Cargo unifies it with gpui-kit's exact pin, so bumping
# gpui-kit needs no edit here. If gpui-kit ever leaves 0.3, the screenshot build
# fails to compile instead of silently testing a different gpui.
gpui-pre = { version = "0.3", features = ["test-support"], optional = true }
# GPUI's HTTP client (the gpui release gpui-kit pins), for GitHub pull
# requests and avatar images.
reqwest_client = { version = "0.3", package = "gpui-pre-reqwest-client" }
http_client = { version = "0.3", package = "gpui-pre-http-client" }
# The terminal panel: the shell's PTY and screen (escape sequences, scrollback).
alacritty_terminal = "0.26.0"

[dev-dependencies]
tempfile = "3.27"

[features]
# `randori --screenshot out.png` renders the first screen offscreen (README images, visual checks).
screenshot = ["dep:gpui-pre", "dep:gpui-pre-macos", "dep:image"]

# The macOS window implements the offscreen render only with its own test-support.
[target."cfg(target_os = \"macos\")".dependencies]
gpui-pre-macos = { version = "0.3", features = ["test-support"], optional = true }
